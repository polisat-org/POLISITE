name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site
        run: |
          mkdir -p _site/assets _site/processo-seletivo _site/projeto _site/sistemas _site/missoes
          cp index.html script.js _site/
          cp processo-seletivo/index.html _site/processo-seletivo/
          cp projeto/index.html _site/projeto/
          cp sistemas/index.html _site/sistemas/
          cp missoes/index.html _site/missoes/
          cp assets/earth-orbit.jpg assets/polisat-logo.svg assets/section-pages.css _site/assets/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4